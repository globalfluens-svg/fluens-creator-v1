    <style>
      :root { color-scheme: dark; }
      html, body { background: #0C0F0E; margin: 0; }
      #initial-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; background: #0C0F0E;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hiding { opacity: 0; pointer-events: none; }
      #initial-loader .il-logo {
        width: 60px; height: 60px;
        border-radius: 13.2px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(14,122,110,0.30);
        animation: il-pulse 1.4s ease-in-out infinite;
      }
      #initial-loader .il-logo svg { display: block; width: 100%; height: 100%; }
      #initial-loader .il-loading {
        display: inline-flex; align-items: baseline;
        font-size: 13px; font-weight: 500;
        color: rgba(236,234,228,0.55); letter-spacing: 0.05em;
      }
      #initial-loader .il-dots-text { display: inline-flex; margin-left: 2px; }
      #initial-loader .il-dots-text span { opacity: 0; animation: il-dot-fade 1.4s ease-in-out infinite; }
      #initial-loader .il-dots-text span:nth-child(1) { animation-delay: 0s; }
      #initial-loader .il-dots-text span:nth-child(2) { animation-delay: 0.2s; }
      #initial-loader .il-dots-text span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes il-pulse {
        0%, 100% { transform: scale(1);    box-shadow: 0 8px 28px rgba(14,122,110,0.28); }
        50%      { transform: scale(1.08); box-shadow: 0 12px 38px rgba(14,122,110,0.42); }
      }
      @keyframes il-dot-fade { 0%, 100% { opacity: 0; } 40%, 60% { opacity: 1; } }
    </style>

TOKOH — FOTO KANON DILAMPIRKAN DI CHAT INI
Wajah tokoh ada di foto yang saya lampirkan. Baca foto itu, lalu susun sendiri
MASTER DESCRIPTOR-nya (usia tampak, etnis, bentuk wajah, mata, alis, hidung,
bibir, rahang, dagu, kulit + undertone, rambut, bahu, leher) dan tampilkan di
blok 3. Salin paragraf itu UTUH ke setiap prompt look.
Nama tokoh dan Kode DNA ambil dari lembar/foto yang saya lampirkan kalau
terlihat; kalau tidak ada, tanyakan ke saya sebelum menamai berkas.
Jangan mengubah wajah, warna kulit, bentuk alis, atau proporsi tubuh dari foto.
Kalau tidak ada foto terlampir, minta saya melampirkannya dulu — jangan

INSTRUKSI
YANG TAMPIL DI LAYAR HANYA DUA HAL:
  1. Galeri look — gambar berjajar, di bawah tiap gambar HANYA "<nomor>. <Nama
     Look>". Titik.
  2. Tautan unduh berkas .txt dan PDF.
Nol tabel, nol daftar, nol spesifikasi, nol prompt, nol keterangan busana, nol
penjelasan, nol kalimat pembuka maupun penutup. Balasanmu dimulai dari gambar
pertama dan berakhir di tautan berkas.

Blok 2 sampai 11 TETAP DISUSUN LENGKAP sesuai template SB8 — semuanya dibutuhkan
untuk membuat prompt dan mengisi PDF — tapi ditulis langsung ke PDF, JANGAN
dicetak di layar. Nama baris teks tetap, jangan diganti/digabung/dihapus.
Data yang tidak ada tetap ada barisnya, diisi [otomatis].

Blok 8 dan 9 wajib memuat SEMUA look. Kalau saya minta 8 look, blok 8 berisi 8
blok LOOK dan blok 9 berisi 8 prompt, bernomor 1-8 berurutan tanpa dobel dan
tanpa loncat.

Berkas: .txt dulu (prompt polos), lalu PDF berisi blok 2-11, minimal 3 halaman.
PDF berisi halaman sampul saja tidak diterima. Tampilkan tautannya saja, tanpa
ringkasan isi.

ATURAN KERAS
- MASTER DESCRIPTOR utuh di setiap prompt. Dilarang "the same woman",
  "the same person", atau merujuk gambar sebelumnya.
- Setiap potongan busana wajib disebut bahannya.
- Minimal 40% look memperlihatkan garis bahu asli.
- Setiap prompt memuat "plain, with no text or logo anywhere on the garment"
  dan alas kaki yang spesifik.
- Sebut ulang lebar bahu, panjang leher, kedalaman kulit, dan undertone di
  setiap prompt.
- Motif berskala besar saja, maksimal satu potongan bermotif per look.
- Tokoh fiktif hasil AI. Tanpa merek dagang pihak ketiga.

TOKOH — FOTO KANON DILAMPIRKAN DI CHAT INI
Baca foto itu, susun MASTER DESCRIPTOR-nya, tampilkan di blok 3, dan salin utuh
ke setiap prompt adegan. Jangan mengubah wajah, warna kulit, bentuk alis, atau
proporsi tubuh dari foto. Kalau tidak ada foto, minta saya melampirkannya dulu.

KONTEN
- Topik / produk : `+(e.topik||"[WAJIB diisi]")+`
- Peran tokoh    : `+e.peran+`
- Platform       : `+e.platform+`
                   → `+Ge.platform[e.platform_v]+`
- Durasi         : `+e.durasi+` detik
- Tujuan         : `+e.tujuan+" → "+Ge.tujuan[e.tujuan_v]+`

STRUKTUR
- Kerangka       : `+e.kerangka+`
                   → `+Ge.kerangka[e.kerangka_v]+`
- Jumlah adegan  : `+e.scene+`
- Hook visual    : `+e.hookv+" → "+Ge.hookv[e.hookv_v]+`
- Hook verbal    : `+e.hook+" → "+Ge.hook[e.hook_v]+`
- CTA            : `+e.cta+" → "+Ge.cta[e.cta_v]+`
- Isi CTA        : `+(e.ctateks||"[buatkan yang paling pas]")+`

SUARA & PRODUKSI
- Cara bicara    : `+e.suara+" → "+Ge.suara[e.suara_v]+`
- Jalur produksi : `+e.jalur+" → "+Ge.jalur[e.jalur_v]+`
- Tone           : `+e.tone+`
- Register       : `+e.sapaan+` — konsisten sepanjang naskah

TAMPILAN — SATU SETEL UNTUK SELURUH VIDEO, tidak berganti antar adegan
- Busana         : `+(e.busana||"[tentukan satu setel, sebut bahannya]")+`
- Latar & cahaya : `+(e.latar||"[tentukan satu, identik di semua adegan]")+`
- Sudut          : `+e.sudut+`
                   → `+Ge.sudut[e.sudut_v]+`
`+(e.sudut_v==="orang"||e.sudut_v==="tripod"?`  ! WAJIB di SETIAP prompt: "this is NOT a selfie, no arm extended toward the
    lens". Kata "smartphone" hampir selalu memicu pose selfie.
`:"")+"- Rasio          : "+e.rasio+" → "+Ge.rasio[e.rasio_v]+`
- Pantangan      : `+(e.pantang||"tidak ada")+`

BATAS YANG TIDAK BOLEH DILANGGAR
- Jumlah kata naskah untuk `+e.durasi+" detik: "+t+` kata. Hitung, jangan kira-kira.
- Adegan 1 maksimal 2 detik dan WAJIB punya teks layar.
- Jatah kata per adegan = durasi adegan x 2,75.
- Dua adegan berurutan tidak boleh sama jenis shot-nya.
- Ada re-hook di sekitar 40% durasi.
- Teks layar maksimal 6 kata, mengambil angka atau kata kunci dari dialog,
  bukan mengulang kalimatnya.
- Satu CTA saja, di akhir, muncul sebagai teks layar SEKALIGUS diucapkan.

INSTRUKSI
Keluarkan output mengikuti TEMPLATE CB10 PERSIS: 12 blok, urutan tetap, nomor
tetap, judul tetap, nama baris tetap. Data yang tidak ada tetap ditampilkan
barisnya, diisi [otomatis].

YANG TAMPIL DI LAYAR hanya lima hal, urut: (1) papan cerita — gambar per adegan
dengan label "<nomor>. <Nama Adegan> · <durasi> detik" saja, (2) blok 6 Rincian
Adegan, (3) blok 7 Naskah Utuh, (4) blok 8 Teks Layar & Caption, (5) tautan
unduh. Blok 2, 3, 4, 5, 9, 10, 11 tetap disusun lengkap tapi ditulis langsung ke
PDF. Tanpa kalimat pembuka maupun penutup.

Blok 6 dan 9 wajib memuat SEMUA adegan, bernomor berurutan tanpa dobel dan tanpa
loncat. Blok 12: berkas .txt dulu, lalu PDF isi blok 2-11 minimal 3 halaman.

ATURAN KERAS
- MASTER DESCRIPTOR utuh + busana + latar di setiap prompt adegan. Dilarang
  "the same woman", "the same person", atau merujuk gambar sebelumnya.
- Sebut ulang lebar bahu, panjang leher, kedalaman kulit, dan undertone.
- Dilarang di naskah: sapaan pembuka, "jangan lupa follow", "di video kali ini",
  "tonton sampai habis", "sekian dari saya", klaim absolut.
- Ekspresi ditulis sebagai gerakan otot, bukan nama emosi, bukan kode AU.
- Sediakan TIGA alternatif kalimat hook untuk adegan pertama.
- Tokoh fiktif hasil AI. Tanpa merek dagang pihak ketiga.

  <body>
    <!-- KONFIGURASI white-label (edit /config.js, tanpa build). Dimuat SEBELUM
         bundle agar window.__FLX_CONFIG sudah siap saat app jalan. -->
    <script src="./config.js?v=1"></script>
    <script>
      // Judul tab + warna brand dari config, di-inject sebagai <style> sebelum
      // bundle → tidak ada kedip warna saat halaman pertama muncul.
      (function () {
        try {
          var cfg = window.__FLX_CONFIG || {};
          if (cfg.theme === 'light') document.documentElement.className += ' theme-light';
          document.documentElement.style.colorScheme = (cfg.theme === 'light') ? 'light' : 'dark';
          if (cfg.brandName) document.title = cfg.brandName + ' — ' + (cfg.tagline || 'Studio Talenta AI');

          var hexToRgb = function (hex) {
            var h = String(hex).replace('#', '').trim();
            if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
            if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
            return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
          };
          var clamp  = function (n) { return Math.max(0, Math.min(255, Math.round(n))); };
          var rgbStr = function (a) { return a[0] + ', ' + a[1] + ', ' + a[2]; };
          var lighten= function (a,p){ return [clamp(a[0]+(255-a[0])*p), clamp(a[1]+(255-a[1])*p), clamp(a[2]+(255-a[2])*p)]; };
          var darken = function (a,p){ return [clamp(a[0]*(1-p)), clamp(a[1]*(1-p)), clamp(a[2]*(1-p))]; };
          var toRgb  = function (a) { return 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')'; };

          var rules = [];
          var ac = hexToRgb(cfg.accentColor);
          if (ac) {
            rules.push('--accent:' + toRgb(ac) + ';');
            rules.push('--accent-rgb:' + rgbStr(ac) + ';');
            rules.push('--accent-hover:' + toRgb(lighten(ac, 0.18)) + ';');
            rules.push('--accent-deep:'  + toRgb(darken(ac, 0.28)) + ';');
            rules.push('--accent-soft:rgba(' + rgbStr(ac) + ',0.14);');
          }
          var a2 = hexToRgb(cfg.accent2Color);
          if (a2) {
            rules.push('--accent2:' + toRgb(a2) + ';');
            rules.push('--accent2-rgb:' + rgbStr(a2) + ';');
          }
          // Penurunan shade WAJIB sadar tema. Dari basis gelap, lighten besar
          // menghasilkan abu-abu hampir putih; dari basis terang, darken besar
          // menghasilkan abu-abu pekat. Arah dan besarannya dibalik per tema.
          var gelap = (cfg.theme !== 'light');
          var bg = hexToRgb(cfg.bgColor);
          if (bg) {
            rules.push('--bg:' + toRgb(bg) + ';');
            if (gelap) {
              rules.push('--bg-deep:'     + toRgb(darken(bg, 0.45)) + ';');
              rules.push('--bg-panel:'    + toRgb(lighten(bg, 0.05)) + ';');
              rules.push('--bg-elev:'     + toRgb(lighten(bg, 0.10)) + ';');
              rules.push('--line:'        + toRgb(lighten(bg, 0.14)) + ';');
              rules.push('--line-strong:' + toRgb(lighten(bg, 0.24)) + ';');
            } else {
              rules.push('--bg-deep:'     + toRgb(darken(bg, 0.05)) + ';');
              rules.push('--bg-panel:'    + toRgb(lighten(bg, 0.55)) + ';');
              rules.push('--bg-elev:'     + toRgb(lighten(bg, 0.90)) + ';');
              rules.push('--line:'        + toRgb(darken(bg, 0.10)) + ';');
              rules.push('--line-strong:' + toRgb(darken(bg, 0.18)) + ';');
            }
            document.documentElement.style.background = toRgb(bg);
            var il = document.getElementById('initial-loader');
            if (il) il.style.background = toRgb(bg);
          }
          if (rules.length) {
            var st = document.createElement('style');
            // :root:not(.theme-light) -> config hanya menimpa mode bawaan;
            // saat pengguna menukar tema lewat tombol, CSS tema yang menang.
            st.textContent = ':root:not(.theme-light){' + rules.join('') + '}';
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>

    <div id="initial-loader">
      <div class="il-logo">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="ilg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0B5F57"/><stop offset="38%" stop-color="#0E7A6E"/>
            <stop offset="72%" stop-color="#1FA898"/><stop offset="100%" stop-color="#D9713F"/>
          </linearGradient></defs>
          <rect width="512" height="512" rx="112" fill="url(#ilg)"/>
          <g transform="translate(133,84) scale(4.4)" stroke="#FAF6F0" stroke-width="4.6" stroke-linecap="round">
            <line x1="14.3" y1="3.8" x2="31.7" y2="3.8"/><line x1="8.3" y1="11.8" x2="41.7" y2="11.8"/>
            <line x1="4.3" y1="19.3" x2="46.7" y2="19.3"/><line x1="2.3" y1="27.3" x2="46.7" y2="27.3"/>
            <line x1="2.3" y1="35.3" x2="42.7" y2="35.3"/><line x1="2.3" y1="43.3" x2="52.7" y2="43.3"/>
            <line x1="2.3" y1="51.3" x2="38.7" y2="51.3"/><line x1="3.3" y1="59.3" x2="45.7" y2="59.3"/>
            <line x1="6.3" y1="67.3" x2="42.7" y2="67.3"/><line x1="11.3" y1="75.3" x2="31.7" y2="75.3"/>
          </g>
        </svg>
      </div>
      <div class="il-loading">Memuat<span class="il-dots-text"><span>.</span><span>.</span><span>.</span></span></div>
    </div>

    <div id="root"></div>

    <!-- Watchdog anti-blank (non-module → jalan bahkan di browser lama).
         Kalau React belum mount setelah 12 detik, ganti splash jadi tombol
         Muat Ulang — bukan "Memuat..." selamanya. -->
    <script>
      (function () {
        setTimeout(function () {
          document.documentElement.className += ' anims-settled';
        }, 1200);
        setTimeout(function () {
          if (!window.__FLX_MOUNTED) {
            var el = document.getElementById('initial-loader');
            if (el) {
              el.innerHTML =
                '<div style="text-align:center;font-family:\'Plus Jakarta Sans\',system-ui,sans-serif;color:#ECEAE4;padding:0 24px">' +
                '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Koneksi lambat atau gagal memuat</div>' +
                '<div style="font-size:12px;color:rgba(236,234,228,.55);margin-bottom:16px">Periksa koneksi internetmu, lalu coba lagi.</div>' +
                '<button onclick="location.reload()" style="background:linear-gradient(45deg,#0B5F57 0%,#0E7A6E 38%,#1FA898 72%,#D9713F 100%);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer">&#8635; Muat Ulang</button>' +
                '</div>';
            }
          }
        }, 12000);
      })();
    </script>

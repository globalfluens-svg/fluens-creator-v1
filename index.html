    <style>
      :root { color-scheme: dark; }
      html, body { background: #0C0F0E; margin: 0; }
      #initial-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; background: #0C0F0E;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hiding { opacity: 0; pointer-events: none; }
      #initial-loader .il-logo {
        width: 60px; height: 60px;
        border-radius: 13.2px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(14,122,110,0.30);
        animation: il-pulse 1.4s ease-in-out infinite;
      }
      #initial-loader .il-logo svg { display: block; width: 100%; height: 100%; }
      #initial-loader .il-loading {
        display: inline-flex; align-items: baseline;
        font-size: 13px; font-weight: 500;
        color: rgba(236,234,228,0.55); letter-spacing: 0.05em;
      }
      #initial-loader .il-dots-text { display: inline-flex; margin-left: 2px; }
      #initial-loader .il-dots-text span { opacity: 0; animation: il-dot-fade 1.4s ease-in-out infinite; }
      #initial-loader .il-dots-text span:nth-child(1) { animation-delay: 0s; }
      #initial-loader .il-dots-text span:nth-child(2) { animation-delay: 0.2s; }
      #initial-loader .il-dots-text span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes il-pulse {
        0%, 100% { transform: scale(1);    box-shadow: 0 8px 28px rgba(14,122,110,0.28); }
        50%      { transform: scale(1.08); box-shadow: 0 12px 38px rgba(14,122,110,0.42); }
      }
      @keyframes il-dot-fade { 0%, 100% { opacity: 0; } 40%, 60% { opacity: 1; } }
    </style>

/* Field pose mana yang berlaku untuk tiap peran. Peran yang belum punya
   daftar pose sengaja tidak ada di sini — briefnya keluar tanpa blok pose,
   persis seperti sebelum fitur ini ada. */
const PERAN_POSE = {
  amb: 'pose_amb', inf: 'pose_inf', ugc: 'pose_ugc', edu: 'pose_edu',
};

/* Nilai Sudut pengambilan dan preset SB10 yang memang bergaya selfie. Frasa
   Inggris kedua nilai selfie memuat "one arm extended toward the lens",
   sementara 'orang' dan 'tripod' memuat kebalikannya secara harfiah — jadi
   pose berlengan-ke-lensa dan pose dua tangan tidak boleh bertemu sembarang
   sudut. Preset 1, 3, dan 4 adalah preset selfie. */
const SUDUT_SELFIE = ['selfiedekat', 'selfielengan'];
const PRESET_SELFIE = ['p1', 'p3', 'p4'];

function kunciPose(f) {
  return PERAN_POSE[f.peran_v] || null;
}

/* Sampai di mana bingkai dipotong untuk tiap nilai Framing. Angkanya
   sengaja sama dengan skala bingkai di POSE_META. */
const FRAME_BATAS = {
  produk: 2, talking: 1, testi: 1, lifestyle: 3, iklan: 3, editorialF: 4,
};

/* Perabot yang masuk akal ada di tiap latar. null = tidak bisa diperiksa. */
const LATAR_PERABOT = {
  studio: ['papan'], kamar: ['kursi', 'meja'], ruangtamu: ['kursi', 'meja'],
  kafe: ['kursi', 'meja'], kafeout: ['kursi', 'meja'],
  kantor: ['kursi', 'meja', 'papan'], kota: [], jalanmalam: [], halte: ['kursi'],
  eskalator: [], mobil: ['kursi'], minimarket: ['meja'], pasar: ['meja'],
  toko: ['meja'], dapur: ['meja'], alam: [], meja: ['kursi', 'meja'],
  bts: ['kursi', 'meja'],
};

function saringPose(f, refL, pakaiPreset) {
  var h = { lolos: [], buang: [], perabotTakDiketahui: false };
  var kunci = kunciPose(f);
  if (!kunci) return h;
  var dipilih = poseTerpilih(f);
  if (!dipilih.length) return h;

  var batas = FRAME_BATAS[f.frame_v] || 4;
  var perabot = null;
  if (!refL && !pakaiPreset && f.latar_v !== 'manual')
    perabot = LATAR_PERABOT[f.latar_v] || [];
  if (perabot === null) h.perabotTakDiketahui = true;

  var selfie =
    SUDUT_SELFIE.indexOf(f.sudut_v) > -1 ||
    (pakaiPreset && PRESET_SELFIE.indexOf(f.preset_v) > -1);

  for (var i = 0; i < dipilih.length; i++) {
    var k = dipilih[i];
    var m = POSE_META[k];
    if (!m) continue;
    if (m.bingkai > batas) {
      h.buang.push([k, 'butuh bingkai lebih lebar daripada framing ' + f.frame]);
      continue;
    }
    if (m.perabot && perabot && perabot.indexOf(m.perabot) < 0) {
      h.buang.push([k, 'butuh ' + m.perabot + ' yang tidak ada di latar ' + f.latar]);
      continue;
    }
    if (m.sudut === 'selfie' && !selfie) {
      h.buang.push([k, 'menjulurkan lengan ke lensa, sementara sudut pengambilan ' +
        f.sudut + ' justru melarangnya secara harfiah']);
      continue;
    }
    if (m.duaTangan && selfie) {
      h.buang.push([k, 'butuh dua tangan bebas, sementara sudut selfie memakai ' +
        'satu lengan untuk memegang kamera']);
      continue;
    }
    h.lolos.push(k);
  }

  /* Look 1 yang menetapkan busana untuk sisa set — jangan diberi pose yang
     memunggungi kamera. */
  for (var j = 0; j < h.lolos.length; j++) {
    if (POSE_META[h.lolos[j]].depan) {
      h.lolos.unshift(h.lolos.splice(j, 1)[0]);
      break;
    }
  }
  return h;
}

/* Mode [REKOMENDASIKAN] berarti aplikasi yang memilihkan: ambil SELURUH daftar
   tertutup peran itu, lalu biarkan penyaring framing, sudut, dan perabot yang
   memangkasnya. Yang sampai ke model tetap tabel jadi — disalin, bukan dipilih
   ulang. Menyerahkan pemilihan ke model berarti MERAKIT, dan aturan merakit
   tidak pernah berhasil di modul ini. */
function poseTerpilih(f) {
  var kunci = kunciPose(f);
  if (!kunci) return [];
  if (f.posemode_v === 'manual') return [];
  if (f.posemode_v === 'rekom')
    return opsiField(kunci).map(function (x) { return x[0]; });
  return f[kunci + '_v'] || [];
}

function barisManualPose(f) {
  var baris = (f.posemanual || '').split('\n');
  var out = [];
  for (var i = 0; i < baris.length; i++)
    if (baris[i].trim()) out.push(baris[i].trim());
  return out;
}

function labelPose(f, k) {
  var kunci = kunciPose(f);
  var o = kunci ? opsiField(kunci) : [];
  for (var i = 0; i < o.length; i++) if (o[i][0] === k) return o[i][1];
  return k;
}

/* Sebarannya dihitung di sini, bukan diserahkan ke model. Kedua masukannya
   sudah pasti saat brief disusun: jumlah look dan pose terpilih. Aturan yang
   menyuruh MENYALIN berhasil; yang menyuruh MERAKIT tidak. */
function blokPoseManual(f, jml) {
  var baris = barisManualPose(f);
  if (!baris.length) return '';
  var out =
    'POSE PER LOOK — SAYA ISI SENDIRI\n' +
    'Baris di bawah saya tulis sendiri, bukan dari daftar tertutup. Terjemahkan\n' +
    'tiap baris jadi SATU frasa Inggris yang lugas, lalu salin ke slot\n' +
    '<POSE look ini> di CETAK BIRU. Frasa itu hanya boleh menyebut badan,\n' +
    'lengan, tangan, tumpuan berat, dan kaki — jangan menambah benda, ekspresi,\n' +
    'arah tatapan, latar, atau framing yang tidak saya sebut.\n' +
    'Look 1 memakai baris look 1, dan seterusnya sampai look ' + jml + '.\n\n';
  for (var i = 1; i <= jml; i++)
    out += '  look ' + i + ' : ' + baris[(i - 1) % baris.length] + '\n';
  out +=
    '\n! Pose yang saya tulis sendiri TIDAK diperiksa aplikasi terhadap framing,\n' +
    '  sudut pengambilan, maupun perabot di latar. Kalau posenya menuntut bagian\n' +
    '  badan yang berada di luar batas potong framing, atau menuntut kursi atau\n' +
    '  meja yang tidak ada di LATAR FINAL, BERHENTI dan minta saya memperbaikinya.\n' +
    '! Kalau baris yang saya tulis meminta tulisan, huruf, angka, logo, atau merek\n' +
    '  pada busana maupun properti: itu BENTROK dengan ATURAN KERAS. Yang menang\n' +
    '  ATURAN KERAS. Ganti jadi permukaan polos, lalu tulis penggantinya di blok 8.\n' +
    'Pose HANYA mengatur badan, lengan, tangan, tumpuan berat, dan kaki. Pose\n' +
    'tidak mengubah ekspresi, arah tatapan, sudut kamera, sudut pengambilan,\n' +
    'latar, maupun framing — semuanya punya barisnya sendiri dan tetap berlaku\n' +
    'apa adanya.\n\n';
  return out;
}

function blokPose(f, jml, refL, pakaiPreset) {
  if (f.posemode_v === 'manual') return blokPoseManual(f, jml);
  var kunci = kunciPose(f);
  if (!kunci) return '';
  var dipilih = poseTerpilih(f);
  if (!dipilih.length) return '';

  var h = saringPose(f, refL, pakaiPreset);
  var i;
  var buangTeks = '';
  for (i = 0; i < h.buang.length; i++)
    buangTeks += '  - ' + labelPose(f, h.buang[i][0]) + ' — ' + h.buang[i][1] + '\n';

  if (!h.lolos.length) {
    /* Buntu total tidak berguna kalau briefnya tidak menyebut jalan keluarnya.
       Jalankan ulang penyaring dengan satu setelan dilonggarkan, lalu sebutkan
       mana yang membuka kembali daftarnya. */
    var saran = '';
    var lebar = Object.assign({}, f, { frame_v: 'editorialF', frame: 'Editorial seluruh badan' });
    var bukanSelfie = Object.assign({}, f, { sudut_v: 'orang', sudut: 'Difoto orang lain' });
    var nLebar = saringPose(lebar, refL, pakaiPreset).lolos.length;
    var nBukanSelfie = saringPose(bukanSelfie, refL, pakaiPreset).lolos.length;
    if (nLebar)
      saran += '  - Longgarkan Framing ke bingkai yang lebih lebar: ' + nLebar +
        ' pose kembali lolos.\n';
    if (nBukanSelfie)
      saran += '  - Ganti Sudut pengambilan jadi bukan selfie: ' + nBukanSelfie +
        ' pose kembali lolos.\n';
    if (!saran)
      saran += '  - Tidak ada satu setelan pun yang membukanya; pilih pose lain\n' +
        '    untuk peran ini.\n';

    return (
      'POSE PER LOOK — TIDAK ADA YANG BERLAKU\n' +
      'Semua pose yang saya pilih tersaring keluar oleh framing, sudut, atau latar\n' +
      'yang saya pilih juga. Untuk set ini TIDAK ADA baris pose: jangan menambah\n' +
      'slot pose ke dalam prompt, dan jangan mengarang posenya sendiri.\n' +
      'Yang tersaring:\n' + buangTeks +
      'Kalau saya minta posenya dipakai, ini yang harus saya ubah:\n' + saran + '\n'
    );
  }

  var out =
    'POSE PER LOOK — SUDAH DITETAPKAN, TINGGAL DISALIN\n' +
    (f.posemode_v === 'rekom'
      ? 'Posenya tidak saya pilih satu per satu. Aplikasi mengambil seluruh daftar\n' +
        'tertutup peran ini, menyaringnya terhadap framing, sudut pengambilan, dan\n' +
        'perabot di latar, lalu menyebar sisanya. Hasilnya tetap tabel di bawah.\n'
      : '') +
    'Baris di bawah bukan saran dan bukan daftar untuk dipilih. Look 1 memakai\n' +
    'baris look 1, look 2 memakai baris look 2, sampai look ' + jml + '.\n' +
    'Salin frasa Inggrisnya APA ADANYA ke slot <POSE look ini> di CETAK BIRU.\n' +
    'Dilarang menukar urutan, dilarang memakai pose di luar daftar ini, dan\n' +
    'dilarang menggabungkan dua baris jadi satu.\n\n';

  var adaProperti = false;
  var adaRambut = false;
  var adaWajahDekat = false;
  var adaPapan = false;
  var adaJari = false;
  var adaSkala = false;
  var adaPakai = false;
  for (i = 1; i <= jml; i++) {
    var k = h.lolos[(i - 1) % h.lolos.length];
    if (POSE_META[k].properti) adaProperti = true;
    if (POSE_META[k].wajahDekat) adaWajahDekat = true;
    if (POSE_META[k].skala) adaSkala = true;
    if (POSE_META[k].pakai) adaPakai = true;
    if (POSE_META[k].papan) adaPapan = true;
    if (POSE_META[k].jari) adaJari = true;
    if (k === 'inf_rambut') adaRambut = true;
    out +=
      '  look ' + i + ' : ' + labelPose(f, k) + '\n' +
      '    ' + Q.pose[k] + '\n';
  }

  out +=
    '\nPose HANYA mengatur badan, lengan, tangan, tumpuan berat, dan kaki. Pose\n' +
    'tidak mengubah ekspresi, arah tatapan, sudut kamera, sudut pengambilan,\n' +
    'latar, maupun framing — semuanya punya barisnya sendiri dan tetap berlaku\n' +
    'apa adanya.\n';

  if (h.lolos.length === 1)
    out +=
      '! Cuma satu pose yang lolos penyaringan, jadi seluruh look memakai pose\n' +
      '  yang sama. Itu memang yang saya kirim — jangan menggantinya sendiri.\n';

  if (adaProperti)
    out +=
      '! Benda yang dipegang pada pose di atas WAJIB polos: tanpa cetakan, huruf,\n' +
      '  angka, label, merek, maupun kemasan bergambar. Kalimat penutup larangan\n' +
      '  teks di CETAK BIRU tetap ikut, tidak digantikan oleh baris ini.\n';

  if (adaWajahDekat)
    out +=
      '! Pose yang menaruh tangan atau benda sejajar wajah menutupi rahang dan\n' +
      '  dagu. Keduanya ada di daftar rincian yang WAJIB disebut ulang di setiap\n' +
      '  prompt — jaga tangan dan benda itu tetap di bawah garis rahang supaya\n' +
      '  titik verifikasi wajah tidak hilang di look itu.\n';

  if (adaPapan)
    out +=
      '! Pose menunjuk papan mensyaratkan papan itu ikut disebut di LATAR FINAL,\n' +
      '  bukan dimunculkan di look itu saja. Papannya WAJIB kosong atau hanya\n' +
      '  memuat bentuk garis sederhana — tanpa satu huruf, angka, atau kata pun.\n' +
      '  Larangan tulisan di latar berlaku penuh, dan alat gambar cenderung\n' +
      '  menambahkan tulisan kabur ke papan yang dibiarkan kosong.\n';

  if (adaJari)
    out +=
      '! Pose yang menunjukkan angka dengan jari adalah bagian yang paling sering\n' +
      '  dirusak alat gambar. Hitung jarinya di look itu sebelum lanjut. Kalau\n' +
      '  salah, ulangi look itu saja — jangan mengubah aturannya.\n';

  if (adaSkala)
    out +=
      '! Pose menunjukkan ukuran menaruh produk sebagai acuan skala di samping\n' +
      '  badan. Kalau ukuran produk di PRODUK FINAL tidak disebut pasti, alat\n' +
      '  gambar akan mengubah skala BADAN supaya cocok, bukan produknya.\n' +
      '  Profil Tubuh terkunci yang menang — sebutkan ukuran produknya.\n';

  if (adaPakai && !(f.produkPakai || '').trim())
    out +=
      '! Pose "Memakai sesuai fungsi" dipakai tapi kolom cara pakai dikosongkan.\n' +
      '  BERHENTI di look itu dan minta saya menyebut apa yang dilakukan tangan.\n' +
      '  Jangan menebak cara pakainya.\n';

  if (adaRambut)
    out +=
      '! Pose merapikan rambut menaruh tangan dekat kepala. Garis rambut ada di\n' +
      '  daftar rincian yang WAJIB disebut ulang di setiap prompt — jari tidak\n' +
      '  boleh menutupi garis rambut maupun dahi di look itu.\n';

  if (h.perabotTakDiketahui)
    out +=
      '! Latar diambil dari foto referensi atau preset, jadi ada tidaknya kursi\n' +
      '  dan meja tidak bisa diperiksa lebih dulu. Kalau LATAR FINAL ternyata\n' +
      '  tidak punya perabot yang dibutuhkan pose duduk atau bersandar, BERHENTI\n' +
      '  di look itu dan minta saya mengganti posenya.\n';

  if (buangTeks)
    out +=
      'Pose yang saya pilih tapi DIBUANG otomatis — jangan dipakai sama sekali:\n' +
      buangTeks;

  return out + '\n';
}

/* PRODUK FINAL bekerja persis seperti LATAR FINAL: satu kalimat, ditulis
   sekali, disalin identik. Produk yang tidak dikunci berubah rupa antar look
   karena alat gambar tidak melihat look sebelumnya. */
function butuhProduk(f, refL, pakaiPreset) {
  var lolos = saringPose(f, refL, pakaiPreset).lolos;
  for (var i = 0; i < lolos.length; i++)
    if (POSE_META[lolos[i]].butuhProduk) return true;
  return false;
}

/* Satu syarat dipakai bersama oleh blok PRODUK FINAL dan slot <PRODUK FINAL>
   di CETAK BIRU. Kalau keduanya dihitung terpisah, brief bisa meminta kalimat
   produk tanpa menyediakan tempat untuk menaruhnya — dan produknya hilang.
   Nilai kolom produk juga hanya berlaku untuk peran yang punya pose berproduk;
   field tersembunyi tetap menyimpan isinya waktu peran diganti. */
function produkDipakai(f, refL, pakaiPreset) {
  if (f.peran_v !== 'ugc') return false;
  if ((f.produk || '').trim()) return true;
  return butuhProduk(f, refL, pakaiPreset);
}

function blokProduk(f, refL, pakaiPreset) {
  if (!produkDipakai(f, refL, pakaiPreset)) return '';
  var perlu = butuhProduk(f, refL, pakaiPreset);
  var isi = (f.produk || '').trim();

  var out = 'PRODUK FINAL — TULIS SEKALI, LALU SALIN KE SETIAP PROMPT\n';
  if (!isi) {
    return (
      out +
      'Kolom produk DIKOSONGKAN, padahal pose di set ini semuanya memegang\n' +
      'produk. BERHENTI sebelum menggambar look pertama dan minta saya menyebut\n' +
      'produknya. Jangan mengarang produk sendiri — produk karangan berubah\n' +
      'bentuk di setiap look dan seluruh set jadi tidak terpakai.\n\n'
    );
  }
  out +=
    '- Produk : ' + isi + '\n' +
    'Susun satu kalimat Inggris yang mengunci produk itu: bentuk, bahan,\n' +
    'ukuran, warna, dan satu penanda bentuk yang selalu terlihat. Kalimat itu\n' +
    'jadi PRODUK FINAL, disalin PERSIS SAMA ke setiap prompt look.\n' +
    'Menulis "produk sama seperti look sebelumnya" TIDAK BEKERJA — alat gambar\n' +
    'tidak melihat look sebelumnya. Hanya kalimat yang disalin yang membuat\n' +
    'produknya sama.\n' +
    'Produk WAJIB polos: tanpa cetakan, huruf, angka, label, merek, maupun\n' +
    'kemasan bergambar. Kalau produk aslinya bermerek, gambarkan bentuk dan\n' +
    'bahannya saja tanpa tulisan apa pun.\n';
  if ((f.produkPakai || '').trim())
    out += '- Cara pakai : ' + f.produkPakai.trim() + '\n' +
      '  Dipakai HANYA di look yang posenya "Memakai sesuai fungsi".\n';
  return out + '\n';
}

function kerangkaLook(n, adaPose) {
  var out = '';
  for (var i = 1; i <= n; i++) {
    out +=
      'LOOK ' + i + ' — <nama look>\n' +
      '  Kebutuhan konten :\n  Atasan           :\n  Luaran           :\n' +
      '  Bawahan          :\n  Alas kaki        :\n  Garis leher      :\n' +
      '  Siluet           :\n  Aksesori         :\n  Gaya rambut      :\n' +
      (adaPose ? '  Pose             :\n' : '') +
      '  Tanda kehidupan  :\n';
  }
  return out;
}

function blokTokoh(f) {
  return (
    'SUMBER IDENTITAS — URUTAN MUTLAK, JANGAN DITUKAR\n' +
    '1. FOTO KANON adalah ACUAN MUTLAK — dan yang dilampirkan HARUS satu foto\n' +
    '   tunggal, yaitu panel foto kanon yang sudah dipotong dari lembar modul 01.\n' +
    '   BUKAN lembar utuhnya.\n' +

function opsiField(k) {
  for (var i = 0; i < fs.length; i++)
    for (var j = 0; j < fs[i].fields.length; j++)
      if (fs[i].fields[j].k === k) return fs[i].fields[j].o || [];
  return [];
}

/* Daftar tertutup yang ikut dicetak saat user memilih "rekomendasikan".
   Model MEMILIH lalu MENYALIN — bukan menyusun frasa sendiri. */
/* ---------- pengacak daftar rekomendasi ----------
   Model punya nilai favorit dan akan memilihnya lagi dan lagi kalau daftarnya
   selalu tercetak dalam urutan yang sama. Jadi urutannya diacak APLIKASI, dan
   briefnya menyuruh mengambil dari atas. Yang diacak urutannya, bukan
   keputusannya — input yang bertentangan tetap boleh memveto.
   Benihnya diturunkan dari seluruh isi form, jadi: form yang sama menghasilkan
   urutan yang sama (bisa diulang), tokoh atau setelan yang berbeda menghasilkan
   urutan yang berbeda. Ubah satu kolom apa pun untuk mengocok ulang. */
function benihTeks(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function benihField(f, k) {
  var s = 'k=' + k + ';';
  for (var n in f)
    if (Object.prototype.hasOwnProperty.call(f, n)) s += n + '=' + f[n] + ';';
  return benihTeks(s);
}

function kocok(daftar, benih) {
  var a = daftar.slice();
  var r = benih >>> 0;
  function berikut() {
    r = (r + 0x6d2b79f5) | 0;
    var t = Math.imul(r ^ (r >>> 15), 1 | r);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(berikut() * (i + 1));
    var s = a[i];
    a[i] = a[j];
    a[j] = s;
  }
  return a;
}

function kandidatAcak(f, k) {
  return kocok(
    opsiField(k).filter(function (o) {
      return o[0] !== 'manual' && o[0] !== 'rekom';
    }),
    benihField(f, k)
  );
}

function daftarKandidat(k, peta, f) {
  var o = f
    ? kandidatAcak(f, k)
    : opsiField(k).filter(function (x) {
        return x[0] !== 'manual' && x[0] !== 'rekom';
      });
  return o
    .map(function (x) { return '      ' + x[1] + ' → ' + peta[x[0]]; })
    .join('\n');
}

function dasarKeputusan(f) {
  var d = [
    'kuadran casting ' + f.kuadran,
    'peran ' + f.peran,
    'kanal ' + (f.kanal.length ? f.kanal.join(', ') : 'belum ditentukan'),
    'iklim tropis Indonesia',
  ];
  if (f.mode_v === 'referensi') d.splice(1, 0, 'outfit di gambar BUSANA');
  else
    d.splice(
      1,
      0,
      'gaya busana ' + (f.arah_v === 'manual' ? f.arahM || '[belum diisi]' : f.arah)
    );
  if (f.modeLatar_v === 'referensi') d.push('latar & cahaya dari gambar LATAR');
  else if (f.preset_v === 'tanpa')
    d.push(
      'latar ' + (f.latar_v === 'manual' ? f.latarM || '[belum diisi]' : f.latar),
      'pencahayaan ' + f.cahaya
    );
  else d.push('preset ' + f.preset);
  if (f.pantang) d.push('pantangan: ' + f.pantang);
  return d.join(' · ');
}

function urutanAcakPerLook(f, k, jml) {
  var a = kandidatAcak(f, k);
  var out = '';
  for (var i = 1; i <= jml; i++)
    out += '      look ' + i + ' : ' + a[(i - 1) % a.length][1] + '\n';
  return out;
}

function barisNilai(f, label, k, peta, manual) {

  return '- ' + label + ' : ' + f[k] + ' → ' + peta[v] + '\n';

function barisMulti(f, label, k, peta, manual, jumlahPilih, catatan) {
  var v = f[k + '_v'] || [];
  if (v.indexOf('rekom') > -1) return barisRekom(f, label, k, peta, jumlahPilih, catatan);
  var teks = v
    .filter(function (r) { return r !== 'manual' && r !== 'rekom'; })
    .map(function (r) { return peta[r]; });
  if (v.indexOf('manual') > -1 && manual) teks.push('[ISI MANUAL] ' + manual);
  return '- ' + label + ' : ' + (teks.length ? teks.join('; ') : '[WAJIB — belum diisi]') + '\n';

TOKOH — FOTO KANON DILAMPIRKAN DI CHAT INI
Baca foto itu, susun MASTER DESCRIPTOR-nya, tampilkan di blok 3, dan salin utuh
ke setiap prompt adegan. Jangan mengubah wajah, warna kulit, bentuk alis, atau
proporsi tubuh dari foto. Kalau tidak ada foto, minta saya melampirkannya dulu.

KONTEN
- Topik / produk : `+(e.topik||"[WAJIB diisi]")+`
- Peran tokoh    : `+e.peran+`
- Platform       : `+e.platform+`
                   → `+Ve.platform[e.platform_v]+`
- Durasi         : `+e.durasi+` detik
- Tujuan         : `+e.tujuan+" → "+Ve.tujuan[e.tujuan_v]+`

STRUKTUR
- Kerangka       : `+e.kerangka+`
                   → `+Ve.kerangka[e.kerangka_v]+`
- Jumlah adegan  : `+e.scene+`
- Hook visual    : `+e.hookv+" → "+Ve.hookv[e.hookv_v]+`
- Hook verbal    : `+e.hook+" → "+Ve.hook[e.hook_v]+`
- CTA            : `+e.cta+" → "+Ve.cta[e.cta_v]+`
- Isi CTA        : `+(e.ctateks||"[buatkan yang paling pas]")+`

SUARA & PRODUKSI
- Cara bicara    : `+e.suara+" → "+Ve.suara[e.suara_v]+`
- Jalur produksi : `+e.jalur+" → "+Ve.jalur[e.jalur_v]+`
- Tone           : `+e.tone+`
- Register       : `+e.sapaan+` — konsisten sepanjang naskah

TAMPILAN — SATU SETEL UNTUK SELURUH VIDEO, tidak berganti antar adegan
- Busana         : `+(e.busana||"[tentukan satu setel, sebut bahannya]")+`
- Latar & cahaya : `+(e.latar||"[tentukan satu, identik di semua adegan]")+`
- Sudut          : `+e.sudut+`
                   → `+Ve.sudut[e.sudut_v]+`
`+(e.sudut_v==="orang"||e.sudut_v==="tripod"?`  ! WAJIB di SETIAP prompt: "this is NOT a selfie, no arm extended toward the
    lens". Kata "smartphone" hampir selalu memicu pose selfie.
`:"")+"- Rasio          : "+e.rasio+" → "+Ve.rasio[e.rasio_v]+`
- Pantangan      : `+(e.pantang||"tidak ada")+`

BATAS YANG TIDAK BOLEH DILANGGAR
- Jumlah kata naskah untuk `+e.durasi+" detik: "+t+` kata. Hitung, jangan kira-kira.
- Adegan 1 maksimal 2 detik dan WAJIB punya teks layar.
- Jatah kata per adegan = durasi adegan x 2,75.
- Dua adegan berurutan tidak boleh sama jenis shot-nya.
- Ada re-hook di sekitar 40% durasi.
- Teks layar maksimal 6 kata, mengambil angka atau kata kunci dari dialog,
  bukan mengulang kalimatnya.
- Satu CTA saja, di akhir, muncul sebagai teks layar SEKALIGUS diucapkan.

INSTRUKSI
Keluarkan output mengikuti TEMPLATE CB10 PERSIS: 12 blok, urutan tetap, nomor
tetap, judul tetap, nama baris tetap. Data yang tidak ada tetap ditampilkan
barisnya, diisi [otomatis].

YANG TAMPIL DI LAYAR hanya lima hal, urut: (1) papan cerita — gambar per adegan
dengan label "<nomor>. <Nama Adegan> · <durasi> detik" saja, (2) blok 6 Rincian
Adegan, (3) blok 7 Naskah Utuh, (4) blok 8 Teks Layar & Caption, (5) tautan
unduh. Blok 2, 3, 4, 5, 9, 10, 11 tetap disusun lengkap tapi ditulis langsung ke
PDF. Tanpa kalimat pembuka maupun penutup.

Blok 6 dan 9 wajib memuat SEMUA adegan, bernomor berurutan tanpa dobel dan tanpa
loncat. Blok 12: berkas .txt dulu, lalu PDF isi blok 2-11 minimal 3 halaman.

ATURAN KERAS
- MASTER DESCRIPTOR utuh + busana + latar di setiap prompt adegan. Dilarang
  "the same woman", "the same person", atau merujuk gambar sebelumnya.
- Sebut ulang lebar bahu, panjang leher, kedalaman kulit, dan undertone.
- Dilarang di naskah: sapaan pembuka, "jangan lupa follow", "di video kali ini",
  "tonton sampai habis", "sekian dari saya", klaim absolut.
- Ekspresi ditulis sebagai gerakan otot, bukan nama emosi, bukan kode AU.
- Sediakan TIGA alternatif kalimat hook untuk adegan pertama.
- Tokoh fiktif hasil AI. Tanpa merek dagang pihak ketiga.

  <body>
    <!-- KONFIGURASI white-label (edit /config.js, tanpa build). Dimuat SEBELUM
         bundle agar window.__FLX_CONFIG sudah siap saat app jalan. -->
    <script src="./config.js?v=1"></script>
    <script>
      // Judul tab + warna brand dari config, di-inject sebagai <style> sebelum
      // bundle → tidak ada kedip warna saat halaman pertama muncul.
      (function () {
        try {
          var cfg = window.__FLX_CONFIG || {};
          if (cfg.theme === 'light') document.documentElement.className += ' theme-light';
          document.documentElement.style.colorScheme = (cfg.theme === 'light') ? 'light' : 'dark';
          if (cfg.brandName) document.title = cfg.brandName + ' — ' + (cfg.tagline || 'Studio Talenta AI');

          var hexToRgb = function (hex) {
            var h = String(hex).replace('#', '').trim();
            if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
            if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
            return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
          };
          var clamp  = function (n) { return Math.max(0, Math.min(255, Math.round(n))); };
          var rgbStr = function (a) { return a[0] + ', ' + a[1] + ', ' + a[2]; };
          var lighten= function (a,p){ return [clamp(a[0]+(255-a[0])*p), clamp(a[1]+(255-a[1])*p), clamp(a[2]+(255-a[2])*p)]; };
          var darken = function (a,p){ return [clamp(a[0]*(1-p)), clamp(a[1]*(1-p)), clamp(a[2]*(1-p))]; };
          var toRgb  = function (a) { return 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')'; };

          var rules = [];
          var ac = hexToRgb(cfg.accentColor);
          if (ac) {
            rules.push('--accent:' + toRgb(ac) + ';');
            rules.push('--accent-rgb:' + rgbStr(ac) + ';');
            rules.push('--accent-hover:' + toRgb(lighten(ac, 0.18)) + ';');
            rules.push('--accent-deep:'  + toRgb(darken(ac, 0.28)) + ';');
            rules.push('--accent-soft:rgba(' + rgbStr(ac) + ',0.14);');
          }
          var a2 = hexToRgb(cfg.accent2Color);
          if (a2) {
            rules.push('--accent2:' + toRgb(a2) + ';');
            rules.push('--accent2-rgb:' + rgbStr(a2) + ';');
          }
          // Penurunan shade WAJIB sadar tema. Dari basis gelap, lighten besar
          // menghasilkan abu-abu hampir putih; dari basis terang, darken besar
          // menghasilkan abu-abu pekat. Arah dan besarannya dibalik per tema.
          var gelap = (cfg.theme !== 'light');
          var bg = hexToRgb(cfg.bgColor);
          if (bg) {
            rules.push('--bg:' + toRgb(bg) + ';');
            if (gelap) {
              rules.push('--bg-deep:'     + toRgb(darken(bg, 0.45)) + ';');
              rules.push('--bg-panel:'    + toRgb(lighten(bg, 0.05)) + ';');
              rules.push('--bg-elev:'     + toRgb(lighten(bg, 0.10)) + ';');
              rules.push('--line:'        + toRgb(lighten(bg, 0.14)) + ';');
              rules.push('--line-strong:' + toRgb(lighten(bg, 0.24)) + ';');
            } else {
              rules.push('--bg-deep:'     + toRgb(darken(bg, 0.05)) + ';');
              rules.push('--bg-panel:'    + toRgb(lighten(bg, 0.55)) + ';');
              rules.push('--bg-elev:'     + toRgb(lighten(bg, 0.90)) + ';');
              rules.push('--line:'        + toRgb(darken(bg, 0.10)) + ';');
              rules.push('--line-strong:' + toRgb(darken(bg, 0.18)) + ';');
            }
            document.documentElement.style.background = toRgb(bg);
            var il = document.getElementById('initial-loader');
            if (il) il.style.background = toRgb(bg);
          }
          if (rules.length) {
            var st = document.createElement('style');
            // :root:not(.theme-light) -> config hanya menimpa mode bawaan;
            // saat pengguna menukar tema lewat tombol, CSS tema yang menang.
            st.textContent = ':root:not(.theme-light){' + rules.join('') + '}';
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>

    <div id="initial-loader">
      <div class="il-logo">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="ilg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0B5F57"/><stop offset="38%" stop-color="#0E7A6E"/>
            <stop offset="72%" stop-color="#1FA898"/><stop offset="100%" stop-color="#D9713F"/>
          </linearGradient></defs>
          <rect width="512" height="512" rx="112" fill="url(#ilg)"/>
          <g transform="translate(133,84) scale(4.4)" stroke="#FAF6F0" stroke-width="4.6" stroke-linecap="round">
            <line x1="14.3" y1="3.8" x2="31.7" y2="3.8"/><line x1="8.3" y1="11.8" x2="41.7" y2="11.8"/>
            <line x1="4.3" y1="19.3" x2="46.7" y2="19.3"/><line x1="2.3" y1="27.3" x2="46.7" y2="27.3"/>
            <line x1="2.3" y1="35.3" x2="42.7" y2="35.3"/><line x1="2.3" y1="43.3" x2="52.7" y2="43.3"/>
            <line x1="2.3" y1="51.3" x2="38.7" y2="51.3"/><line x1="3.3" y1="59.3" x2="45.7" y2="59.3"/>
            <line x1="6.3" y1="67.3" x2="42.7" y2="67.3"/><line x1="11.3" y1="75.3" x2="31.7" y2="75.3"/>
          </g>
        </svg>
      </div>
      <div class="il-loading">Memuat<span class="il-dots-text"><span>.</span><span>.</span><span>.</span></span></div>
    </div>

    <div id="root"></div>

    <!-- Watchdog anti-blank (non-module → jalan bahkan di browser lama).
         Kalau React belum mount setelah 12 detik, ganti splash jadi tombol
         Muat Ulang — bukan "Memuat..." selamanya. -->
    <script>
      (function () {
        setTimeout(function () {
          document.documentElement.className += ' anims-settled';
        }, 1200);
        setTimeout(function () {
          if (!window.__FLX_MOUNTED) {
            var el = document.getElementById('initial-loader');
            if (el) {
              el.innerHTML =
                '<div style="text-align:center;font-family:\'Plus Jakarta Sans\',system-ui,sans-serif;color:#ECEAE4;padding:0 24px">' +
                '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Koneksi lambat atau gagal memuat</div>' +
                '<div style="font-size:12px;color:rgba(236,234,228,.55);margin-bottom:16px">Periksa koneksi internetmu, lalu coba lagi.</div>' +
                '<button onclick="location.reload()" style="background:linear-gradient(45deg,#0B5F57 0%,#0E7A6E 38%,#1FA898 72%,#D9713F 100%);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer">&#8635; Muat Ulang</button>' +
                '</div>';
            }
          }
        }, 12000);
      })();
    </script>
